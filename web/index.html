<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>DNA Sequence Analyzer</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <aside class="sidebar">
    <header class="sidebar-head">
      <a class="brand" href="./">
        <svg viewBox="0 0 24 40" aria-hidden="true"><path d="M5 2c0 10 14 10 14 18S5 28 5 38M19 2c0 10-14 10-14 18s14 8 14 18M6 5h12M8 9h8M7 15h10M5 20h14M7 25h10M8 31h8M6 35h12"/></svg>
        <span>DNA Sequence Analyzer</span>
      </a>
      <button id="menu-toggle" type="button" aria-controls="sidebar-controls" aria-expanded="false">Menú</button>
    </header>
    <div id="sidebar-controls" class="sidebar-controls">
      <section class="sample" aria-labelledby="sample-heading">
        <h2 id="sample-heading">Archivo</h2>
        <p id="sample-name">Cargando ejemplo…</p>
        <select id="record-select" aria-label="Registro activo"></select>
      </section>
      <section aria-labelledby="tools-heading">
        <h2 id="tools-heading">Herramientas</h2>
        <nav aria-labelledby="tools-heading" id="navigation"></nav>
      </section>
      <div class="sidebar-actions">
        <button id="import-open" class="primary" type="button">Importar FASTA</button>
        <button id="export-open" type="button">Exportar</button>
      </div>
    </div>
  </aside>
  <main id="main" tabindex="-1">
    <section class="metrics" aria-label="Métricas del registro" id="metrics"></section>
    <p id="status" role="status"></p>
    <div class="workspace">
      <section id="content" aria-label="Análisis de la secuencia"></section>
      <aside class="right-panel" aria-label="Región y control de calidad">
        <form id="region" class="card padded">
          <h2>Región</h2>
          <label>Inicio <input name="start" type="number" min="1" required disabled></label>
          <label>Fin <input name="end" type="number" min="1" required disabled></label>
          <button class="primary" type="submit" disabled>Aplicar</button>
          <button id="region-clear" type="button" hidden>Quitar selección</button>
          <p id="region-status" role="status"></p>
        </form>
        <section class="card padded quality" aria-labelledby="qc-heading">
          <h2 id="qc-heading">Control de calidad</h2>
          <ul id="checks" class="checks"></ul>
        </section>
      </aside>
    </div>
  </main>
  <dialog id="import-dialog" aria-labelledby="import-heading">
    <form method="dialog" class="dialog-head"><h2 id="import-heading">Importar FASTA</h2><button aria-label="Cerrar">×</button></form>
    <div id="drop"><label>Seleccionar archivo <input id="file" type="file" accept=".fasta,.fa,.fna,.fas,.txt"></label><p>También puedes arrastrar el archivo aquí.</p></div>
    <form id="paste-form">
      <label for="paste">Pegar FASTA o secuencia</label>
      <textarea id="paste" rows="5" placeholder="&gt;mi_registro&#10;ATGC" required></textarea>
      <div class="actions"><button class="primary" type="submit">Cargar texto</button><button id="example" type="button">Cargar ejemplo</button></div>
    </form>
    <p id="import-status" role="status"></p>
  </dialog>
  <dialog id="export-dialog" aria-labelledby="export-heading">
    <form method="dialog" class="dialog-head"><h2 id="export-heading">Exportar</h2><button aria-label="Cerrar">×</button></form>
    <div class="export-options">
      <button type="button" data-format="csv">Resumen CSV</button>
      <button type="button" data-format="fasta">Proteínas FASTA</button>
      <button type="button" data-format="gff3">ORFs GFF3</button>
      <button type="button" data-format="html">Informe HTML</button>
    </div>
    <p id="export-status" role="status"></p>
  </dialog>
</body>
</html>
