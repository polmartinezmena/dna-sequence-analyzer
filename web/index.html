<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F4EF">
  <title>DNA Sequence Analyzer</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <aside class="sidebar">
    <a class="brand" href="./">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2c0 10 12 10 12 20M18 2c0 10-12 10-12 20M7 5h10M7 19h10M9 9h6m-6 6h6"/></svg>
      <span>DNA Sequence<br>Analyzer</span>
    </a>
    <section class="sample" aria-labelledby="sample-heading">
      <h2 id="sample-heading">Muestra</h2>
      <p id="sample-name">Cargando ejemplo…</p>
      <label for="record-select">Registro activo</label>
      <select id="record-select"></select>
    </section>
    <nav aria-label="Análisis" id="navigation"></nav>
    <button id="theme" type="button" aria-pressed="false">Tema oscuro</button>
  </aside>
  <main id="main" tabindex="-1">
    <header class="top">
      <div><p class="eyebrow">Archivo FASTA</p><h1 id="filename">DNA Sequence Analyzer</h1></div>
      <div class="actions">
        <button id="import-open" class="primary" type="button">Importar FASTA</button>
        <button id="export-open" type="button">Exportar</button>
      </div>
    </header>
    <p id="status" role="status"></p>
    <section class="metrics" aria-label="Totales de la muestra" id="metrics"></section>
    <div class="workspace">
      <section id="content" aria-label="Análisis de la secuencia"></section>
      <aside class="card quality" aria-labelledby="qc-heading">
        <h2 id="qc-heading">Control de calidad</h2>
        <ul id="checks" class="checks"></ul>
        <h2>Registro seleccionado</h2>
        <dl id="record-details"></dl>
        <form id="region">
          <h2>Región (1-based)</h2>
          <div class="fields">
            <label>Inicio <input name="start" type="number" min="1" required></label>
            <label>Fin <input name="end" type="number" min="1" required></label>
          </div>
          <button type="submit">Aplicar</button>
          <p id="region-status" role="status"></p>
        </form>
      </aside>
    </div>
    <section class="card" aria-labelledby="records-heading">
      <h2 id="records-heading">Registros</h2>
      <div id="records"></div>
    </section>
  </main>
  <dialog id="import-dialog" aria-labelledby="import-heading">
    <form method="dialog" class="dialog-head"><h2 id="import-heading">Importar FASTA</h2><button aria-label="Cerrar">×</button></form>
    <div id="drop"><label>Seleccionar archivo <input id="file" type="file" accept=".fasta,.fa,.fna,.fas,.txt"></label><p>También puedes arrastrar el archivo aquí.</p></div>
    <form id="paste-form">
      <label for="paste">Pegar FASTA o secuencia</label>
      <textarea id="paste" rows="5" placeholder="&gt;mi_registro&#10;ATGC" required></textarea>
      <div class="actions"><button class="primary" type="submit">Cargar texto</button><button id="example" type="button">Cargar ejemplo</button></div>
    </form>
    <p id="import-status" role="status"></p>
  </dialog>
  <dialog id="export-dialog" aria-labelledby="export-heading">
    <form method="dialog" class="dialog-head"><h2 id="export-heading">Exportar</h2><button aria-label="Cerrar">×</button></form>
    <div class="export-options">
      <button type="button" data-format="csv">Resumen CSV</button>
      <button type="button" data-format="fasta">Proteínas FASTA</button>
      <button type="button" data-format="gff3">ORFs GFF3</button>
      <button type="button" data-format="html">Informe HTML</button>
    </div>
    <p id="export-status" role="status"></p>
  </dialog>
</body>
</html>
