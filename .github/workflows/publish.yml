name: Publicar en PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/tests.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar la versión de la etiqueta
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as config:
              version = tomllib.load(config)["project"]["version"]
          expected = f"v{version}"
          if os.environ["GITHUB_REF_NAME"] != expected:
              raise SystemExit(f"La etiqueta debe ser {expected}.")
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
