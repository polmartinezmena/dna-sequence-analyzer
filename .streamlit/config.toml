[theme]
primaryColor = "#165C70"
font = "sans serif"
baseRadius = "small"

[theme.light]
backgroundColor = "#FCFDFE"
secondaryBackgroundColor = "#EDF3F5"
textColor = "#142B37"
borderColor = "#C8D7DE"

[theme.dark]
backgroundColor = "#101B23"
secondaryBackgroundColor = "#192B36"
textColor = "#E7F1F5"
primaryColor = "#83C7D8"
borderColor = "#415661"

[theme.light.sidebar]
backgroundColor = "#203b49"
secondaryBackgroundColor = "#2e4b5a"
textColor = "#f1f6f8"
primaryColor = "#a1e1d8"
borderColor = "#677f8b"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
