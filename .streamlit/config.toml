[theme]
primaryColor = "#165C70"
font = "sans serif"
baseRadius = "small"

[theme.light]
backgroundColor = "#FCFDFE"
secondaryBackgroundColor = "#EDF3F5"
textColor = "#142B37"
borderColor = "#C8D7DE"

[theme.dark]
backgroundColor = "#101B23"
secondaryBackgroundColor = "#192B36"
textColor = "#E7F1F5"
primaryColor = "#83C7D8"
borderColor = "#415661"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
