[theme]
primaryColor = "#5741bd"
font = "sans serif"
baseRadius = "small"

[theme.light]
backgroundColor = "#fdfcfe"
secondaryBackgroundColor = "#f0edf7"
textColor = "#242036"
borderColor = "#d8d1e5"

[theme.dark]
backgroundColor = "#191722"
secondaryBackgroundColor = "#262234"
textColor = "#f3effa"
primaryColor = "#c4b6ff"
borderColor = "#4a415e"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
