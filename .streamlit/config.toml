[theme]
primaryColor = "#363bb8"
font = "sans serif"
baseRadius = "small"

[theme.light]
backgroundColor = "#f7f9fc"
secondaryBackgroundColor = "#e9edf5"
textColor = "#202632"
borderColor = "#cdd5e3"

[theme.dark]
backgroundColor = "#171c25"
secondaryBackgroundColor = "#262e3b"
textColor = "#edf1f7"
primaryColor = "#aab3ff"
borderColor = "#485365"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
