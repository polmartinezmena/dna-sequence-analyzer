[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-sequence-analyzer"
version = "0.2.0"
description = "Command-line toolkit for DNA sequence analysis. Reads FASTA and reports GC content, window composition, GC skew, and oligo Tm."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pol Martinez Mena", email = "pol.martinez.mena@gmail.com" }]
keywords = ["bioinformatics", "fasta", "gc-content", "dna"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython>=1.81",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plot = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/polmartinezmena-byte/dna-sequence-analyzer"
Repository = "https://github.com/polmartinezmena-byte/dna-sequence-analyzer"

[project.scripts]
dna-analyzer = "dna_sequence_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
