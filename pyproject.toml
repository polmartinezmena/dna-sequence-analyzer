[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-sequence-analyzer"
version = "1.0.0"
description = "DNA sequence analysis toolkit with a command line and a Streamlit web app."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pol Martinez Mena", email = "pol.martinez.mena@gmail.com" }]
keywords = ["bioinformatics", "fasta", "gc-content", "dna", "orf", "blast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython>=1.81",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plot = ["matplotlib>=3.8"]
web = ["streamlit>=1.55", "plotly>=5.24", "jinja2>=3.1"]

[project.urls]
Homepage = "https://github.com/polmartinezmena/dna-sequence-analyzer"
Repository = "https://github.com/polmartinezmena/dna-sequence-analyzer"
Issues = "https://github.com/polmartinezmena/dna-sequence-analyzer/issues"

[project.scripts]
dna-analyzer = "dna_sequence_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/dna-sequence-analyzer" = ["data/examples.fasta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
